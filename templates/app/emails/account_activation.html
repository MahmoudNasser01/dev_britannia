<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Activated</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .email-container { max-width: 600px; margin: auto; background: #ffffff; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .logo { max-width: 150px; margin-bottom: 20px; }
        .btn { background: #007BFF; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; }
        .footer { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="email-container">
        <img src="cid:logo" alt="Logo" class="logo">
        <h2>Welcome, {{ student_name }}! 🎉</h2>
        <p>We’re excited to let you know that your account has been successfully activated.</p>
        <a href="" class="btn">Login to Your Account</a>
        <p class="footer">If you did not request this email, please ignore it.</p>
    </div>

</body>
</html>
